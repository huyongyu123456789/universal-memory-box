name: Build macOS apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build/runtime dependencies
        run: python -m pip install --upgrade pip pyinstaller ".[desktop,macos]"
      - name: Build app icon
        run: iconutil -c icns assets/icons/macos/MemoryBox.iconset -o assets/icons/macos/MemoryBox.icns
      - name: Build native macOS app bundle
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --argv-emulation
          --name "Memory Box"
          --icon assets/icons/macos/MemoryBox.icns
          --osx-bundle-identifier com.memorybox.desktop
          --add-data "assets/icons/master.png:assets/icons"
          memorybox_desktop.py
      - name: Build CLI/MCP binary
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name MemoryBox-CLI
          memorybox_main.py
      - name: Add Finder document associations
        run: python platforms/macos/postprocess_plist.py "dist/Memory Box.app/Contents/Info.plist"
      - name: Ad-hoc sign development artifact
        run: codesign --deep --force --sign - "dist/Memory Box.app"
      - name: Validate app bundle and launch entry
        run: |
          plutil -lint "dist/Memory Box.app/Contents/Info.plist"
          codesign --verify --deep --strict "dist/Memory Box.app"
          "dist/Memory Box.app/Contents/MacOS/Memory Box" --help >/dev/null
          ./dist/MemoryBox-CLI --help >/dev/null
      - name: Assemble macOS release
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Memory Box.app" "release/MemoryBox-macOS-${{ matrix.arch }}.zip"
          cp dist/MemoryBox-CLI release/MemoryBox-CLI
          cp README.md README.zh-CN.md LICENSE release/
          hdiutil create -volname "Memory Box" -srcfolder "dist/Memory Box.app" -ov -format UDZO "release/MemoryBox-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Memory-Box-macOS-${{ matrix.arch }}
          path: release/*
