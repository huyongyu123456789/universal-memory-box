name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
  windows-desktop-deps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ".[desktop]"
      - run: python -c "import webview, pystray, PIL; from memorybox.desktop import load_desktop_settings; print(load_desktop_settings())"
