<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Box</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#181818;background:#f5f5f3}*{box-sizing:border-box}body{margin:0;width:420px;min-height:520px}.wrap{padding:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-size:18px;font-weight:800}.status{font-size:12px}.ok{color:#207744}.bad{color:#a43b2d}.hero{background:#20211f;color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}.hero p{font-size:12px;color:#c8c8c3;margin:4px 0 12px}.row{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:650}.btn.primary{background:#fff;color:#1f201e}.btn.dark{background:#20211f;color:#fff}.btn.soft{background:#e9e9e5;color:#20211f}.btn.small{padding:6px 8px;font-size:11px}input,textarea,select{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px;background:#fff}textarea{min-height:80px;resize:vertical}.panel{background:#fff;border:1px solid #e3e3df;border-radius:14px;padding:12px;margin:10px 0}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}.search{display:flex;gap:7px}.memory{border-top:1px solid #eee;padding:10px 0}.memory:first-child{border-top:0}.meta{font-size:10px;color:#777}.title{font-size:13px;font-weight:750;margin:2px 0 4px}.summary{font-size:11px;color:#555;line-height:1.45;max-height:48px;overflow:hidden}.actions{display:flex;gap:6px;margin-top:7px}.hint{font-size:10px;color:#777;line-height:1.4}.toast{display:none;background:#eef7f0;border:1px solid #cce5d2;color:#1d6737;padding:8px;border-radius:10px;font-size:11px;margin:8px 0}.empty{font-size:12px;color:#777;padding:16px 0;text-align:center}
</style>
</head>
<body><div class="wrap">
<div class="head"><div class="brand">🧠 Memory Box</div><div id="status" class="status">检查连接…</div></div>
<div id="toast" class="toast"></div>
<div class="hero"><b>网页 AI ↔ 本地记忆盒</b><p>保存当前对话及你选择的附件，或把旧记忆恢复到当前聊天输入框。扩展不会自动发送消息。</p><div class="row"><button id="saveSel" class="btn primary">保存选中对话</button><button id="saveChat" class="btn primary">保存当前聊天</button></div><div style="margin-top:10px"><input id="chatFiles" type="file" multiple><div class="hint" style="color:#d0d0cb;margin-top:5px">可选：PDF、Word、图片、CSV、代码等附件会与本次记忆一起保存。网页平台不能保证自动读取其云端附件，因此需要你在这里选择本地文件。</div></div></div>
<div class="tabs"><button class="btn dark" data-tab="memories">记忆</button><button class="btn soft" data-tab="manual">粘贴保存</button></div>
<section id="memories"><div class="search"><input id="q" placeholder="搜索记忆…"><button id="search" class="btn dark">搜索</button></div><div id="list" class="panel"><div class="empty">正在读取…</div></div><div class="hint">“恢复到聊天”只填入当前输入框，由你确认后再发送。</div></section>
<section id="manual" style="display:none"><div class="panel"><textarea id="manualText" placeholder="粘贴需要保存的对话或笔记…"></textarea><div style="height:7px"></div><button id="saveManual" class="btn dark">一键保存</button></div></section>
</div><script src="popup.js"></script></body></html>
